{% set name = "service_identity" %}
{% set version = "26.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6358c52882c96e66ac4a55eb3a72c7dd4a70763f8cc6fa4e70abde2656f4bf3b

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation --ignore-installed . --verbose
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme
  run:
    - python
    - attrs >=19.1.0
    - cryptography>=47

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
  imports:
    - service_identity
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/pyca/service_identity
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Service identity verification for pyOpenSSL.
  description: |
    service_identity aspires to give you all the tools you need for verifying
    whether a certificate is valid for the intended purposes.
  doc_url: https://service-identity.readthedocs.io/en/stable/
  dev_url: https://github.com/pyca/service_identity

extra:
  recipe-maintainers:
    - isuruf
